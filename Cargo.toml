[package]
name = "db-mcp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Minimal MCP server for databases"
readme = "README.md"

[[bin]]
name = "dbmcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8.9"
base64 = "0.22.1"
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
cloudiful-server = { package = "cloudiful-server", version = "0.2.2", default-features = false, features = ["axum", "mcp"] }
futures-util = "0.3.32"
humantime = "2.3.0"
rmcp = { version = "1.6.0", features = ["server", "schemars", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", default-features = false, features = ["any", "postgres", "sqlite", "runtime-tokio-rustls"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower = "0.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"

[dev-dependencies]
