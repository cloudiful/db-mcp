[package]
name = "db-mcp"
version = "0.1.6"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Minimal MCP server for databases"
readme = "README.md"

[[bin]]
name = "dbmcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
futures-util = "0.3.34"
humantime = "2.4.0"
oracle-rs = "0.1.7"
rmcp = { version = "3.3.0", default-features = false, features = ["macros", "server", "schemars", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "sqlite", "macros", "sqlx-toml"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"

[dev-dependencies]
rmcp = { version = "3.3.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
