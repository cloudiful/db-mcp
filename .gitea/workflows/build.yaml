name: Build and Publish
run-name: Build and Publish by ${{ gitea.actor }}

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: gitea.cloud1ful.com
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_GTCR }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: gitea.cloud1ful.com/${{ gitea.repository }}:latest
          cache-from: type=registry,ref=gitea.cloud1ful.com/${{ gitea.repository }}:buildcache
          cache-to: type=registry,ref=gitea.cloud1ful.com/${{ gitea.repository }}:buildcache,mode=max
