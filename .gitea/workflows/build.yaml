name: Build and Publish
run-name: Build and Publish by ${{ gitea.actor }}

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and publish on main
        uses: https://gitea.cloud1ful.com/actions/docker-build-publish@main
        with:
          registry: gitea.cloud1ful.com
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_GTCR }}
          context: .
          push: true
          tags: gitea.cloud1ful.com/${{ gitea.repository }}:latest
          cache-from: type=registry,ref=gitea.cloud1ful.com/${{ gitea.repository }}:latest
