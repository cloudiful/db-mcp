name: CI
run-name: CI by ${{ github.actor }}

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Rust tests
        uses: https://forgejo.cloud1ful.com/actions/workflows/actions/rust-ci@v0.1.4
        with:
          test_command: cargo test
