name: Release Docker Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  IMAGE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('manual-{0}', github.run_number) }}

jobs:
  build-binaries:
    name: Build ${{ matrix.target }} binary
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RELEASE_ARCHIVE: db-mcp-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('manual-{0}', github.run_number) }}-${{ matrix.target }}.tar.gz
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.16.0

      - name: Build binary
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RUSTC_WRAPPER: sccache
          SCCACHE_BASEDIRS: ${{ github.workspace }}
          SCCACHE_BUCKET: sccache
          SCCACHE_ENDPOINT: https://12412d5b061683494ea3e5c217d6a961.r2.cloudflarestorage.com
          SCCACHE_REGION: auto
        run: cargo build --locked --release --target "${TARGET}" --bin dbmcp

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package
          install -Dm755 "target/${TARGET}/release/dbmcp" package/dbmcp
          tar -czf "${RELEASE_ARCHIVE}" -C package dbmcp
          test -s "${RELEASE_ARCHIVE}"

      - name: Show sccache stats
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RUSTC_WRAPPER: sccache
          SCCACHE_BASEDIRS: ${{ github.workspace }}
          SCCACHE_BUCKET: sccache
          SCCACHE_ENDPOINT: https://12412d5b061683494ea3e5c217d6a961.r2.cloudflarestorage.com
          SCCACHE_REGION: auto
        run: sccache --show-stats

      - name: Upload binary archive
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.RELEASE_ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

  build-image-inputs:
    name: Prepare Docker input ${{ matrix.arch }}
    needs:
      - build-binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      BINARY_ARCHIVE: db-mcp-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('manual-{0}', github.run_number) }}-${{ matrix.target }}.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Linux binary
        uses: actions/download-artifact@v8
        with:
          name: binary-${{ matrix.target }}
          path: binary-artifact

      - name: Prepare Docker input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-image-input/bin
          tar -xzf "binary-artifact/${BINARY_ARCHIVE}" -C binary-artifact
          install -Dm755 binary-artifact/dbmcp ci-image-input/bin/dbmcp
          test -x ci-image-input/bin/dbmcp

      - name: Upload Docker input
        uses: actions/upload-artifact@v7
        with:
          name: docker-input-${{ matrix.arch }}
          path: ci-image-input
          if-no-files-found: error
          retention-days: 7

  build-images:
    name: Publish Docker image ${{ matrix.arch }}
    needs:
      - build-image-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Docker input
        uses: actions/download-artifact@v8
        with:
          name: docker-input-${{ matrix.arch }}
          path: ci-image-input

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}-${{ matrix.arch }}
            type=raw,value=latest-${{ matrix.arch }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: app-runtime
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=db-mcp-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=db-mcp-${{ matrix.arch }}

  publish-manifest:
    name: Publish multi-architecture Docker manifest
    needs:
      - build-images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish version and latest manifests
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            "${IMAGE_NAME}:${IMAGE_TAG}-amd64" \
            "${IMAGE_NAME}:${IMAGE_TAG}-arm64"
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:latest-amd64" \
            "${IMAGE_NAME}:latest-arm64"
          docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}"

  publish-release:
    name: Publish binary release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download binary archives
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: binary-artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: sha256sum binary-artifacts/*.tar.gz | sort -k2 > binary-artifacts/SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            binary-artifacts/*.tar.gz
            binary-artifacts/SHA256SUMS
